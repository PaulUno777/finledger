# Local stack for FinLedger (Postgres + Redis).
# App config layers: image/defaults → optional file mount → env vars.
# To override Spring config from the host:
#   mkdir -p ./config && edit ./config/application.yml
#   then run the app with SPRING_CONFIG_ADDITIONAL_LOCATION=optional:file:./config/
#
# Dev credentials below are for local evaluation only — never reuse in production.

services:

  postgres:
    image: postgres:17-alpine
    container_name: finledger-postgres

    environment:
      POSTGRES_DB: finledger
      POSTGRES_USER: finledger
      POSTGRES_PASSWORD: finledger

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finledger" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine

    container_name: finledger-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
