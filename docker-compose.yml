# Local stack for FinLedger (Postgres; optional app / observability / sandbox profiles).
# App config layers: image/defaults → optional file mount → env vars.
#
#   docker compose up -d
#   docker compose --profile sandbox up -d --build    # in-box JWT; read config/sandbox-ready.txt
#   docker compose --profile with-app up -d --build   # .env drives issuer (default external+OIDC;
#                                                     # or issuer=internal + signing key for IdP-less)
#   docker compose --profile with-app --profile observability up -d --build
#
# Dev credentials below are for local evaluation only — never reuse in production.
# Health (app image): GET http://localhost:8081/actuator/health
# Metrics: GET http://localhost:8081/actuator/prometheus
# Grafana (observability profile): http://localhost:3000 (admin/admin)

services:
  postgres:
    image: postgres:17-alpine
    container_name: finledger-postgres

    environment:
      POSTGRES_DB: finledger
      POSTGRES_USER: finledger
      POSTGRES_PASSWORD: finledger

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Start with: docker compose --profile with-app up -d --build
  # Defaults below are prod-oriented (normal + external). Override via project `.env`:
  #   IdP:     FINLEDGER_SECURITY_ISSUER=external + SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=…
  #   IdP-less: FINLEDGER_SECURITY_ISSUER=internal + FINLEDGER_ENV=local + signing key/clients/bootstrap
  # Signing key inside the container (volume ./config → /workspace/config):
  #   FINLEDGER_INTERNAL_SIGNING_KEY_PATH=/workspace/config/internal-signing.pem
  app:
    profiles: ["with-app"]
    build: .
    image: finledger:local
    container_name: finledger-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-normal}
      FINLEDGER_ENV: ${FINLEDGER_ENV:-production}
      FINLEDGER_SECURITY_ISSUER: ${FINLEDGER_SECURITY_ISSUER:-external}
      FINLEDGER_INTERNAL_SIGNING_KEY_PATH: ${FINLEDGER_INTERNAL_SIGNING_KEY_PATH:-/workspace/config/internal-signing.pem}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
      DB_URL: jdbc:postgresql://postgres:5432/finledger
      DB_USERNAME: finledger_app
      DB_PASSWORD: finledger
      SPRING_FLYWAY_USER: finledger
      SPRING_FLYWAY_PASSWORD: finledger
    volumes:
      - ./config:/workspace/config:ro

  # Start with: docker compose --profile sandbox up -d --build
  # Never sets prod. Mint credentials dumped to ./config/sandbox-ready.txt (gitignored).
  app-sandbox:
    profiles: ["sandbox"]
    build: .
    image: finledger:local
    container_name: finledger-app-sandbox
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: sandbox
      FINLEDGER_ENV: local
      FINLEDGER_SECURITY_ISSUER: internal
      FINLEDGER_SANDBOX_DUMP_PATH: /workspace/config/sandbox-ready.txt
      FINLEDGER_SANDBOX_BASE_URL: http://localhost:8080
      FINLEDGER_SANDBOX_SCENARIO: ${FINLEDGER_SANDBOX_SCENARIO:-simple}
      DB_URL: jdbc:postgresql://postgres:5432/finledger
      DB_USERNAME: finledger_app
      DB_PASSWORD: finledger
      SPRING_FLYWAY_USER: finledger
      SPRING_FLYWAY_PASSWORD: finledger
    volumes:
      - ./config:/workspace/config

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.4.1
    container_name: finledger-prometheus
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.0.2
    container_name: finledger-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
