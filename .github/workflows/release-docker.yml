name: Release Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Multi-arch image + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finledger:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/finledger:latest

      - name: Generate release notes
        id: notes
        run: |
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## FinLedger ${{ steps.version.outputs.version }}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since \`${PREV}\`:"
              echo
              git log "${PREV}..HEAD" --pretty=format:'- %s (%h)'
            else
              echo "Initial tagged release."
              echo
              git log --pretty=format:'- %s (%h)'
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FinLedger ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
