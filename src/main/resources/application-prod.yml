# Production profile — supply secrets via environment / secret store only.
# Never commit real credentials. Prefer SPRING_DATASOURCE_* / SPRING_DATA_REDIS_*
# when aligning with Spring relaxed binding.

spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true