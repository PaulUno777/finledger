# Dev-only profile for local IDE / swagger runs against docker-compose.
# Credentials are local evaluation only — never reuse in production.
#
# OIDC (FL-100): set an issuer or JWKS URI before starting the app, e.g.
#   export SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://your-idp/realms/finledger
# The API requires Bearer JWTs (RS256/ES256) with scopes ledger:read|write|admin
# and claim tenant_id matching the path tenant for tenant-scoped routes.

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/finledger
    # Non-superuser so FORCE RLS applies (POSTGRES_USER is a superuser and bypasses RLS).
    username: finledger_app
    password: finledger

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    user: finledger
    password: finledger

  data:
    redis:
      host: localhost
      port: 6379
