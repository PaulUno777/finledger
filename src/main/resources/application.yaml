spring:

  application:
    name: finledger

  profiles:
    active: local

  # Temporary until FL-100 (OIDC). SecurityFilterChain still permitAll for /api/**.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration

  # Layered config (plan §18.1): defaults here → optional external file → env vars.
  # Mount or place overrides under ./config (local) or /workspace/config (container).
  config:
    additional-location: optional:file:./config/,optional:file:/workspace/config/

server:
  port: 8080

management:

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
