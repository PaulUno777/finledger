# Sandbox eval profile (FL-151) — NEVER combine with prod.
# Security mode disabled; seeds sandbox tenant + demo accounts on boot.

finledger:
  env: local
  security:
    mode: disabled
  sandbox:
    dump-path: ${FINLEDGER_SANDBOX_DUMP_PATH:config/sandbox-ready.txt}
    base-url: ${FINLEDGER_SANDBOX_BASE_URL:http://localhost:8080}

spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finledger}
    username: ${DB_USERNAME:finledger_app}
    password: ${DB_PASSWORD:finledger}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER:finledger}
    password: ${SPRING_FLYWAY_PASSWORD:finledger}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
