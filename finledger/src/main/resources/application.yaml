spring:

  application:
    name: finledger

  profiles:
    active: local

  # Layered config (plan §18.1): defaults here → optional external file → env vars.
  # Mount or place overrides under ./config (local) or /workspace/config (container).
  config:
    additional-location: optional:file:./config/,optional:file:/workspace/config/

  # OIDC Resource Server (FL-100). Set via env:
  # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
  # or SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI

server:
  port: 8080

management:

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized

  tracing:
    sampling:
      probability: 1.0

  observations:
    key-values:
      application: ${spring.application.name}

  # Set OTEL_EXPORTER_OTLP_ENDPOINT or
  # management.opentelemetry.tracing.export.otlp.endpoint to enable OTLP export.
  # Leave unset for local Prometheus-only (ADR-013).

logging:
  level:
    root: INFO

finledger:
  env: ${FINLEDGER_ENV:local}
  security:
    # enforced (default) | static-token | disabled — see ADR-014
    mode: ${FINLEDGER_SECURITY_MODE:enforced}
  fraud:
    enabled: false
  sandbox:
    dump-path: config/sandbox-ready.txt
    base-url: http://localhost:8080
